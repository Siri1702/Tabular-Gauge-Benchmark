# Few-Shot Learning Analysis - Dataset Configuration
# Selected datasets to stress-test few-shot learning capabilities
# Focus on very small datasets to test TabPFN's foundation model pretraining

datasets:
  # Tiny datasets (N < 300) - for extreme few-shot testing
  # These are from OpenML and UCI ML repository

  - id: 44             # spambase - will subsample heavily
    name: spambase_tiny
    task: binary
    target: class
    n_rows: 4601
    n_features: 57
    domain: nlp-derived
    notes: "Will subsample to N=200 for tiny regime"

  # Small datasets (300 < N < 700)
  - id: 37
    name: diabetes
    task: binary
    target: class
    n_rows: 768
    n_features: 8
    domain: healthcare
    notes: "Small but classic - good for few-shot"

  - id: 1510
    name: wdbc
    task: binary
    target: diagnosis
    n_rows: 569
    n_features: 30
    domain: healthcare
    notes: "Very small -乳腺癌 Wisconsin"

  - id: 40536
    name: australian
    task: binary
    target: class
    n_rows: 690
    n_features: 14
    domain: finance
    notes: "Australian credit - tiny"

  # Medium datasets (700 < N < 1500)
  - id: 31
    name: credit-g
    task: binary
    target: class
    n_rows: 1000
    n_features: 20
    domain: finance
    notes: "German Credit - standard benchmark"

  - id: 40945
    name: titanic
    task: binary
    target: survived
    n_rows: 891
    n_features: 11
    domain: historical
    notes: "Classic - interpretable features"

  - id: 1462
    name: banknote-auth
    task: binary
    target: class
    n_rows: 1372
    n_features: 4
    domain: security
    notes: "Very clean - low dim stress test"

  # Large datasets (N > 1500) for comparison
  - id: 1067
    name: kc1
    task: binary
    target: defects
    n_rows: 2109
    n_features: 21
    domain: software
    notes: "Software defects - imbalanced"

  - id: 1487
    name: ozone-level
    task: binary
    target: class
    n_rows: 2536
    n_features: 72
    domain: environment
    notes: "Higher dimensional"


# Training sizes to test for each dataset
# Note: These are the SUBSAMPLED training sizes, not original dataset sizes
few_shot_train_sizes:
  # Extreme few-shot (foundation model sweet spot)
  - 25
  - 50
  - 75

  # Very small (transition zone)
  - 100
  - 150
  - 200

  # Small (typical small data)
  - 300
  - 500

  # Medium (most benchmarks)
  - 750
  - 1000

  # Full (use all available training data)
  - null  # null means use full training set


# Analysis settings
analysis:
  n_seeds: 3  # Number of random seeds per configuration
  test_size: 0.2

  # Critical thresholds for analysis
  crossover_detection:
    # Look for crossovers around these sizes
    critical_points: [50, 100, 200, 500]

  # Data efficiency metrics
  efficiency_metrics:
    - roc_auc_per_sample
    - convergence_threshold: 0.95  # Stop testing if model reaches 95% of max performance